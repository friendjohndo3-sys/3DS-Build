name: Build 3DS Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 3DS Packages & Symlink Rules
        run: |
          # 1. Install toolchains and build utilities
          dkp-pacman -Syu --noconfirm 3ds-dev 3dstools

          # 2. Ensure /opt/devkitpro/libctru directory exists
          mkdir -p /opt/devkitpro/libctru

          # 3. Create symlinks for all legacy rule names expected by older Makefiles
          for f in /opt/devkitpro/devkitARM/*; do
            filename=$(basename "$f")
            ln -sf "$f" "/opt/devkitpro/libctru/$filename"
          done

          # Map default_targets to 3ds_rules or base_rules
          if [ -f /opt/devkitpro/devkitARM/3ds_rules ]; then
            ln -sf /opt/devkitpro/devkitARM/3ds_rules /opt/devkitpro/libctru/default_targets
          elif [ -f /opt/devkitpro/devkitARM/base_rules ]; then
            ln -sf /opt/devkitpro/devkitARM/base_rules /opt/devkitpro/libctru/default_targets
          fi

      - name: Build Project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make clean || true
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3ds-homebrew-binaries
          path: |
            *.3dsx
            *.cia
            *.smdh
            build/*.3dsx
            build/*.cia
            output/*.3dsx
            output/*.cia
