name: Build 3DS Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup devkitPro
        uses: devkitPro/actions/setup@v1
        with:
          packages: 3ds-dev 3dstools 3ds-libctru citro3d

      - name: Build Project
        run: |
          make
          
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-homebrew-binaries
          path: |
            *.3dsx
            *.cia
            *.smdh
