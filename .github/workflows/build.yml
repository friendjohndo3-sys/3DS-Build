name: Build 3DS Homebrew

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare DevkitPro Environment
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev 3dstools
          mkdir -p /opt/devkitpro/libctru

          # 1. Provide base_tools
          if [ -f /opt/devkitpro/devkitARM/base_tools ]; then
            ln -sf /opt/devkitpro/devkitARM/base_tools /opt/devkitpro/libctru/base_tools
          fi

          # 2. Provide default_targets expected by sub-make inside /build
          cat << 'EOF' > /opt/devkitpro/libctru/default_targets
          all: $(OUTPUT).3dsx $(OUTPUT).elf $(OUTPUT).cia

          $(OUTPUT).3dsx: $(OUTPUT).elf
          	@3dsxtool $< $@ $(_3DSXDEPS)

          $(OUTPUT).elf: $(OFILES)
          	$(LD) $(LDFLAGS) $(OFILES) $(LIBPATHS) $(LIBS) -o $@

          %.o: %.c
          	$(CC) $(CFLAGS) -c $< -o $@

          %.o: %.cpp
          	$(CXX) $(CXXFLAGS) -c $< -o $@
          EOF

      - name: Build Project
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PATH=$DEVKITPRO/tools/bin:$DEVKITARM/bin:$PATH
          make

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3ds-homebrew-binaries
          path: |
            *.3dsx
            *.cia
            *.elf
            build/*.3dsx
            build/*.cia
